# Workflow for building and releasing Omega Android APK
name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de la release (ej: v1.0.0 o latest)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --dangerously-allow-all-builds 2>&1 | tee pnpm_install.log

      - name: Build Web Application
        id: build_web
        run: pnpm run build 2>&1 | tee pnpm_build.log

      - name: Run Test Suite
        id: test
        run: pnpm run test 2>&1 | tee test_suite.log

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Configure Android SDK & Licenses
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 | tee sdkmanager_licenses.log || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-35" 2>&1 | tee sdkmanager_install.log || true

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew 2>&1 | tee chmod_gradlew.log

      - name: Sync Capacitor Android
        id: cap_sync
        run: pnpm exec cap sync android 2>&1 | tee cap_sync.log

      - name: Build Android APK
        id: build_apk
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'omega2025' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'omega' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'omega2025' }}
        run: |
          for i in 1 2 3; do
            ./gradlew --version && break || (echo "Gradle wrapper retry $i..." && sleep 5)
          done
          ./gradlew assembleRelease --stacktrace 2>&1 | tee gradle_build.log || ./gradlew assembleDebug --stacktrace 2>&1 | tee -a gradle_build.log

      - name: Prepare APK for Release
        id: prepare_apk
        run: |
          mkdir -p build-output
          APK_FILE=$(find android/app/build/outputs/apk -name "*release*.apk" ! -name "*unaligned*" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" ! -name "*unaligned*" | head -n 1)
          fi
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Found built APK at: $APK_FILE"
            cp "$APK_FILE" build-output/Omega.apk
            ls -lh build-output/Omega.apk
          else
            echo "Error: No APK found in android/app/build/outputs/apk!"
            find android/app/build -type f || true
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        id: upload_apk
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Omega-Android-APK
          path: build-output/Omega.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Create or Update GitHub Release
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            RELEASE_TAG="${{ github.event.inputs.release_tag }}"
            RELEASE_TITLE="Omega Android ${{ github.event.inputs.release_tag }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            RELEASE_TAG="${{ github.ref_name }}"
            RELEASE_TITLE="Omega Android ${{ github.ref_name }}"
          else
            RELEASE_TAG="latest"
            RELEASE_TITLE="Omega Android (Latest Version)"
          fi

          echo "Target release tag: $RELEASE_TAG"
          echo "Target release title: $RELEASE_TITLE"

          cat << 'EOF' > /tmp/release_notes.md
          ## 🌌 Omega $RELEASE_TAG — Wim Hof Method Suite & Sacred Geometry

          Comprehensive Open Source release featuring the **Wim Hof Method suite**: breathing retention timelines, 4-week progressive cold shower challenges, apnea push-up counter, and offline-first vitality dashboard.

          ### 📥 Direct APK Download
          Download the attached pre-compiled APK directly:
          👉 **[Omega.apk](https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/Omega.apk)**

          ### 🚀 Installation Instructions
          1. Download `Omega.apk` on your Android device.
          2. Tap the downloaded file to install (enable "Allow from this source" if prompted).
          3. Open Omega and experience the full Wim Hof breathwork, cold exposure, and progress tracking!

          ### ✨ What's New in $RELEASE_TAG
          - 🧊 **20-Day Cold Shower Challenge**: 4 progressive weeks (15s to 60s) with 432Hz audio feedback and calendar completion tracking.
          - 💪 **Apnea Push-Up Test**: Wim Hof retention push-up counter, elapsed stopwatch, and auto-logging.
          - 📊 **Vitality & Progress Screen**: 28-day activity heatmap, 10 unlockable hexagonal badges, and full JSON backup/restore.
          - 🔷 **Wim Hof Sacred Geometry**: Rounded hexagon SVG (`R=86, cr=14`) with glassmorphism sheen, pulsating halos, and continuous perimeter progress ring.
          - 🎵 **432Hz Zen Audio Engine**: Web Audio synthesizer with Tibetan singing bowls, smooth bells, and native tactile haptics.
          - 📱 **5-Tab Navigation**: Fluid switching between Hub, Breathing, Cold Exposure, Challenges, and Progress.
          - 🛡️ **Zero-Drift Architecture**: Monotonic performance.now() timers immune to background throttling.
          EOF
          sed -i "s|\$RELEASE_TAG|$RELEASE_TAG|g" /tmp/release_notes.md

          echo "Publishing release $RELEASE_TAG..."
          # Clean up any legacy releases to ensure clean 1.0.0 baseline
          for old_tag in v1.1.0 v1.2.0 v1.3.0 v1.4.0; do
            gh release delete "$old_tag" --yes 2>/dev/null || true
          done
          gh release delete "$RELEASE_TAG" --yes 2>/dev/null || true

          gh release create "$RELEASE_TAG" build-output/Omega.apk \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/release_notes.md \
            2>&1 | tee /tmp/release.log || {
              echo "Create fallback, attempting clobber upload..."
              gh release upload "$RELEASE_TAG" build-output/Omega.apk --clobber 2>&1 | tee -a /tmp/release.log || true
            }
          echo "GitHub Release step completed!"

      - name: Report pipeline telemetry to feedback branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          APK_GEN="false"
          APK_SZ="none"
          if [ -f "build-output/Omega.apk" ]; then
            APK_GEN="true"
            APK_SZ=$(ls -lh build-output/Omega.apk | awk '{print $5}')
          fi
          git fetch origin ci-feedback:refs/remotes/origin/ci-feedback 2>/dev/null || true
          git checkout -B ci-feedback refs/remotes/origin/ci-feedback 2>/dev/null || git checkout -B ci-feedback
          mkdir -p logs
          echo "JOB_STATUS=${{ job.status }}" > logs/verify.txt
          echo "BUILD_WEB_OUTCOME=${{ steps.build_web.outcome }}" >> logs/verify.txt
          echo "TEST_OUTCOME=${{ steps.test.outcome }}" >> logs/verify.txt
          echo "CAP_SYNC_OUTCOME=${{ steps.cap_sync.outcome }}" >> logs/verify.txt
          echo "BUILD_APK_OUTCOME=${{ steps.build_apk.outcome }}" >> logs/verify.txt
          echo "PREPARE_APK_OUTCOME=${{ steps.prepare_apk.outcome }}" >> logs/verify.txt
          echo "UPLOAD_APK_OUTCOME=${{ steps.upload_apk.outcome }}" >> logs/verify.txt
          echo "RELEASE_OUTCOME=${{ steps.release.outcome }}" >> logs/verify.txt
          echo "APK_GENERATED=$APK_GEN" >> logs/verify.txt
          echo "APK_SIZE=$APK_SZ" >> logs/verify.txt
          echo "SHA=${{ github.sha }}" >> logs/verify.txt
          echo "REF=${{ github.ref }}" >> logs/verify.txt
          echo "DATE=$(date -u)" >> logs/verify.txt
          cp *.log logs/ 2>/dev/null || true
          cp /tmp/release.log logs/release.log 2>/dev/null || true
          cp android/*.log logs/ 2>/dev/null || true
          find android/app/build -name "*.txt" -exec cp {} logs/ \; 2>/dev/null || true
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            cp logs/verify.txt logs/tag_release_verify.txt
            git add -f logs/
            git commit -m "ci: release report for ${{ github.ref }} (${{ github.sha }}) [skip ci]" || true
            git push -f origin HEAD:refs/heads/ci-release 2>&1 || true
          else
            git add -f logs/
            git commit -m "ci: complete build report for ${{ github.ref }} (${{ github.sha }}) [skip ci]" || true
          fi
          git push -f origin HEAD:refs/heads/ci-feedback 2>&1 || echo "ci-feedback push skipped"
