# Workflow for building and releasing Omega Android APK
name: Build & Release Android APK

on:

  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de la release (ej: v1.0.0 o latest)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --dangerously-allow-all-builds 2>&1 | tee pnpm_install.log

      - name: Build Web Application
        run: pnpm run build 2>&1 | tee pnpm_build.log

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Configure Android SDK & Licenses
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 | tee sdkmanager_licenses.log || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-35" 2>&1 | tee sdkmanager_install.log || true

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew 2>&1 | tee chmod_gradlew.log

      - name: Sync Capacitor Android
        run: pnpm exec cap sync android 2>&1 | tee cap_sync.log

      - name: Build Android APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'omega2025' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'omega' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'omega2025' }}
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle_build.log || ./gradlew assembleRelease --stacktrace 2>&1 | tee -a gradle_build.log

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" ! -name "*unaligned*" | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Found built APK at: $APK_FILE"
            cp "$APK_FILE" build-output/Omega.apk
            ls -lh build-output/Omega.apk
          else
            echo "Error: No APK found in android/app/build/outputs/apk!"
            find android/app/build -type f || true
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omega-Android-APK
          path: build-output/Omega.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            RELEASE_TAG="${{ github.event.inputs.release_tag }}"
            RELEASE_TITLE="Omega Android ${{ github.event.inputs.release_tag }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            RELEASE_TAG="${{ github.ref_name }}"
            RELEASE_TITLE="Omega Android ${{ github.ref_name }}"
          else
            RELEASE_TAG="latest"
            RELEASE_TITLE="Omega Android (Latest Version)"
          fi

          echo "Target release tag: $RELEASE_TAG"
          echo "Target release title: $RELEASE_TITLE"

          cat << 'EOF' > release_notes.md
## 🌌 Omega v1.2.0 — Unified Wellness Hub (Wim Hof Orange Hexagons Edition)

Release featuring the faithfully restored iconic **orange hexagon geometry** and vibrant Wim Hof Method aesthetics across Bubble Breathing, alongside Android 17 glassmorphism, 90Hz/120Hz GPU performance, responsive desktop layout, and dual Android/PC build capability.

### 📥 Direct APK Download
Download the attached pre-compiled APK directly:
👉 **[Omega.apk](https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/Omega.apk)**

### 🚀 Installation Instructions
1. Download `Omega.apk` on your Android device.
2. Tap the downloaded file to install (enable "Allow from this source" if prompted).
3. Open Omega and enjoy the restored Wim Hof breathing experience!

### ✨ What's New in v1.2.0
- 🔶 **Restored Original Orange Hexagons**: Canonical 6-sided polygon clip-path geometry restored in Bubble Breathing exercise, retention, and recovery screens.
- 🔥 **Wim Hof Warm Amber/Orange Palette**: Dynamic gradient styling (`#ff9d00` / `#ff6b00`) with last-breath golden pulse and dedicated phase glows.
- 🎨 **Android 17 & Glassmorphism Design System**: Tactile frosted glass, luminous borders, and continuous squircles.
- ⚡ **90Hz / 120Hz (ProMotion) High-Refresh Optimization**: Pure GPU hardware layer composition (`transform`, `will-change`), zero layout thrashing, and drift-free delta timers.
- 🖥️ **Adaptive Responsive Experience**: Bottom Navigation on mobile (<768px); dynamic Navigation Rail and multi-column grid on desktop (≥768px).
- 💻 **Cross-Platform PC & Electron Support**: Pre-configured Electron desktop packaging (`npm run electron:build`).
- 🌬️ **Bubble Breathing**: Rhythmic guided Wim Hof breathing with restored geometry, apnea timer, and recovery phase.
- ❄️ **HydroCycle**: Hot/cold contrast shower interval timer with ambient soundscapes.
- 🔒 **Native Services Universal Bridge**: Fault-tolerant Keep-Awake cascade (Electron IPC, Capacitor, Web WakeLock) and tactile haptics.
EOF
          sed -i "s|\$RELEASE_TAG|$RELEASE_TAG|g" release_notes.md

          echo "Checking if release $RELEASE_TAG exists..."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Uploading/overwriting APK..."
            gh release upload "$RELEASE_TAG" build-output/Omega.apk --clobber 2>&1 | tee release_upload.log
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file release_notes.md 2>&1 | tee -a release_upload.log
          else
            echo "Creating new release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" build-output/Omega.apk \
              --title "$RELEASE_TITLE" \
              --notes-file release_notes.md \
              2>&1 | tee release_upload.log || {
                echo "Create failed, attempting clobber upload..."
                gh release upload "$RELEASE_TAG" build-output/Omega.apk --clobber 2>&1 | tee -a release_upload.log || true
              }
          fi
          echo "GitHub Release completed successfully!"

      - name: Push Success Confirmation to ci-status Branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git checkout -B ci-status
          mkdir -p ci-status-info
          echo "STATUS=SUCCESS" > ci-status-info/build_status.txt
          echo "RUN_NUMBER=${{ github.run_number }}" >> ci-status-info/build_status.txt
          echo "COMMIT=${{ github.sha }}" >> ci-status-info/build_status.txt
          echo "COMPLETED_AT=$(date -u)" >> ci-status-info/build_status.txt
          cp *.log ci-status-info/ 2>/dev/null || true
          git add -f ci-status-info
          git commit -m "ci: success confirmation from run ${{ github.run_number }} [skip ci]" || true
          git push -f origin ci-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Failure Diagnostics to ci-logs Branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git checkout -B ci-logs
          mkdir -p ci-debug
          echo "FAILED_ACTION=$GITHUB_ACTION" > ci-debug/failed_step.txt
          echo "RUN_NUMBER=${{ github.run_number }}" >> ci-debug/failed_step.txt
          cp *.log ci-debug/ 2>/dev/null || true
          cp android/*.log ci-debug/ 2>/dev/null || true
          find android/app/build -name "*.txt" -exec cp {} ci-debug/ \; 2>/dev/null || true
          git status > ci-debug/status.txt || true
          git add -f ci-debug
          git commit -m "ci: failure logs from run ${{ github.run_number }}" || true
          git push -f origin ci-logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
