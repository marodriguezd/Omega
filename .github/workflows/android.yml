# Workflow for building and releasing Omega Android APK
name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Informational only: branch/manual runs never publish to GitHub Releases (v* tags only)'
        required: false
        default: ''

# Least privilege: read-only by default. The single build-apk job below
# re-elevates to contents:write because v* tag runs publish the GitHub
# Release and push ci-feedback telemetry from that same job.
permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    # Tag runs create/update the shared GitHub Release (desktop.yml
    # publishes DMG/MSI/AppImage to the same tag concurrently) and push
    # pipeline telemetry; branch runs simply do not use this grant.
    permissions:
      contents: write

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        # Reproducible CI install: --frozen-lockfile resolves only from the
        # committed pnpm-lock.yaml and never mutates it. Postinstall builds
        # (electron, esbuild, …) are already allowlisted in
        # pnpm-workspace.yaml (onlyBuiltDependencies), so
        # --dangerously-allow-all-builds is not needed here.
        run: pnpm install --frozen-lockfile 2>&1 | tee pnpm_install.log

      - name: Build Web Application
        id: build_web
        run: pnpm run build 2>&1 | tee pnpm_build.log

      - name: Run Test Suite
        id: test
        run: pnpm run test 2>&1 | tee test_suite.log

      - name: Ensure native icons (regenerate if missing)
        run: |
          if [ ! -f build/icon.icns ] || [ ! -f build/icon.ico ] || [ ! -f build/icons/512x512.png ]; then
            python3 -c "import PIL" 2>/dev/null || pip install pillow
            python3 scripts/generate-icons.py
          else
            echo "Native icons present."
          fi

      - name: Run Platform Suite + Validate Packaging
        id: test_platform
        run: |
          node tests/runner-platform.js 2>&1 | tee test_platform.log
          node tests/runner-release.js 2>&1 | tee test_release.log
          node scripts/validate-build.mjs 2>&1 | tee validate.log

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-meta.mjs --tag=${{ github.ref_name }}

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Configure Android SDK & Licenses
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 | tee sdkmanager_licenses.log || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-35" 2>&1 | tee sdkmanager_install.log || true

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew 2>&1 | tee chmod_gradlew.log

      - name: Sync Capacitor Android
        id: cap_sync
        run: pnpm exec cap sync android 2>&1 | tee cap_sync.log

      - name: Build Android APK
        id: build_apk
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eo pipefail
          for i in 1 2 3; do
            ./gradlew --version && break || (echo "Gradle wrapper retry $i..." && sleep 5)
          done
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/ci-release-key.jks
            export KEYSTORE_FILE='ci-release-key.jks'
            echo "SIGNING=android-production" >> "$GITHUB_ENV"
            echo "### Android signing: PRODUCTION keystore from CI secrets" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "FATAL: v* tag builds require the ANDROID_KEYSTORE_BASE64 secret (see docs/SIGNING.md)." >&2
            echo "Dev-keystore APKs must never be published as releases." >&2
            exit 1
          else
            # Non-tag CI builds: generate an ephemeral throwaway dev keystore.
            # Never used for releases; the repository ships no keystore.
            keytool -genkeypair -v -keystore app/dev-local-key.jks \
              -alias omega-dev -keyalg RSA -keysize 2048 -validity 30 \
              -storepass omega-dev-local -keypass omega-dev-local \
              -dname "CN=Omega Dev, OU=Dev, O=Omega, C=US" 2>&1 | tail -n 2
            export KEYSTORE_FILE='dev-local-key.jks'
            export KEYSTORE_PASSWORD='omega-dev-local'
            export KEY_ALIAS='omega-dev'
            export KEY_PASSWORD='omega-dev-local'
            echo "SIGNING=android-dev" >> "$GITHUB_ENV"
            echo "### Android signing: DEV keystore (ephemeral local artifact only — see docs/SIGNING.md)" >> "$GITHUB_STEP_SUMMARY"
          fi
          # Tag (production) builds run ONLY assembleRelease: a release
          # failure must fail the job. The debug-APK fallback in the else
          # branch below is branch-only and must never run for tags.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ./gradlew assembleRelease --stacktrace 2>&1 | tee gradle_build.log
          else
            ./gradlew assembleRelease --stacktrace 2>&1 | tee gradle_build.log \
              || ./gradlew assembleDebug --stacktrace 2>&1 | tee -a gradle_build.log
          fi

      - name: Prepare APK for Release
        id: prepare_apk
        run: |
          set -eo pipefail
          mkdir -p build-output
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Production tags accept ONLY app-release.apk. A debug artifact
            # must never be published under a production filename.
            if [ -n "$(find android/app/build/outputs/apk -name 'app-debug*.apk' ! -name '*unaligned*' | head -n 1)" ]; then
              echo "FATAL: debug APK present in a tag build — refusing to publish." >&2
              exit 1
            fi
            APK_FILE=$(find android/app/build/outputs/apk -name 'app-release*.apk' ! -name '*unaligned*' | head -n 1)
            if [ -z "$APK_FILE" ]; then
              echo "FATAL: no app-release APK in a tag build — refusing to publish." >&2
              exit 1
            fi
          else
            APK_FILE=$(find android/app/build/outputs/apk -name "*release*.apk" ! -name "*unaligned*" | head -n 1)
            if [ -z "$APK_FILE" ]; then
              APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" ! -name "*unaligned*" | head -n 1)
            fi
          fi
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            # The manifest must never claim production signing for a
            # non-release APK, even if SIGNING was set earlier.
            if [ "${SIGNING:-}" = "android-production" ]; then
              case "$APK_FILE" in
                *app-release*.apk) ;;
                *)
                  echo "FATAL: production signing claimed for non-release APK ($APK_FILE)." >&2
                  exit 1
                  ;;
              esac
            fi
            echo "Found built APK at: $APK_FILE"
            VERSION=$(node -p "require('./package.json').version")
            cp "$APK_FILE" build-output/Omega.apk
            cp "$APK_FILE" "build-output/Omega-${VERSION}.apk"
            # Platform-scoped metadata names: desktop.yml publishes
            # manifest-mac/windows/linux.json + SHA256SUMS-desktop.txt to the
            # same tag concurrently, so shared names (manifest.json /
            # SHA256SUMS.txt) would clobber each other. Distinct per-platform
            # names let concurrent publishes compose instead of racing.
            node scripts/make-manifest.mjs build-output --platform=android --signing="${SIGNING:-android-unknown}" --out=manifest-android.json
            node scripts/make-checksums.mjs build-output --extra=manifest-android.json --out=SHA256SUMS-android.txt
            ls -lh build-output/
          else
            echo "Error: No APK found in android/app/build/outputs/apk!"
            find android/app/build -type f || true
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        id: upload_apk
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Omega-Android-APK
          path: |
            build-output/*.apk
            build-output/SHA256SUMS-android.txt
            build-output/manifest-android.json
          retention-days: 14
          if-no-files-found: warn

      - name: Create or Update GitHub Release
        id: release
        # Production Releases are tag-only: branch and manual-dispatch runs
        # stop after the workflow-artifact upload above, so the floating
        # `latest` release can never serve a dev-signed APK to the public.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RELEASE_TAG="${{ github.ref_name }}"
          case "$RELEASE_TAG" in
            v[0-9]*)
              ;;
            *)
              echo "FATAL: refusing to publish non-version tag '$RELEASE_TAG' as a production release." >&2
              exit 1
              ;;
          esac
          RELEASE_TITLE="Omega ${RELEASE_TAG}"
          VERSION=$(node -p "require('./package.json').version")

          echo "Target release tag: $RELEASE_TAG"
          echo "Target release title: $RELEASE_TITLE"

          cat << 'EOF' > /tmp/release_notes.md
          ## 🌌 Omega $RELEASE_TAG — Wim Hof Method Suite & Sacred Geometry

          Comprehensive Open Source release featuring the **Wim Hof Method suite**: breathing retention timelines, 4-week progressive cold shower challenges, apnea push-up counter, and offline-first vitality dashboard.

          ### 📥 Direct APK Download
          Download the attached pre-compiled APK directly:
          👉 **[Omega-$VERSION.apk](https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/Omega-$VERSION.apk)**
          (compat alias: [Omega.apk](https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/Omega.apk))

          ### 🚀 Installation Instructions
          1. Download `Omega.apk` on your Android device.
          2. Tap the downloaded file to install (enable "Allow from this source" if prompted).
          3. Open Omega and experience the full Wim Hof breathwork, cold exposure, and progress tracking!

          ### ✨ What's New in $RELEASE_TAG
          - 🧊 **20-Day Cold Shower Challenge**: 4 progressive weeks (15s to 60s) with 432Hz audio feedback and calendar completion tracking.
          - 💪 **Apnea Push-Up Test**: Wim Hof retention push-up counter, elapsed stopwatch, and auto-logging.
          - 📊 **Vitality & Progress Screen**: 28-day activity heatmap, 10 unlockable hexagonal badges, and full JSON backup/restore.
          - 🔷 **Wim Hof Sacred Geometry**: Rounded hexagon SVG (`R=86, cr=14`) with glassmorphism sheen, pulsating halos, and continuous perimeter progress ring.
          - 🎵 **432Hz Zen Audio Engine**: Web Audio synthesizer with Tibetan singing bowls, smooth bells, and native tactile haptics.
          - 📱 **5-Tab Navigation**: Fluid switching between Hub, Breathing, Cold Exposure, Challenges, and Progress.
          - 🛡️ **Zero-Drift Architecture**: Monotonic performance.now() timers immune to background throttling.
          EOF
          sed -i "s|\$RELEASE_TAG|$RELEASE_TAG|g" /tmp/release_notes.md
          sed -i "s|\$VERSION|$VERSION|g" /tmp/release_notes.md

          echo "Publishing release $RELEASE_TAG..."
          # Shared release-creation strategy (mirrored in desktop.yml
          # release-desktop): never delete the release — desktop publishes
          # DMG/MSI/AppImage to this same tag concurrently, and a delete
          # would silently wipe those assets. Create once, then
          # clobber-upload, so concurrent publishes compose instead of
          # racing. Per-platform metadata names (manifest-android.json,
          # SHA256SUMS-android.txt vs desktop's manifest-*.json,
          # SHA256SUMS-desktop.txt) guarantee the clobber sets are disjoint.
          # v1.0.0 is the canonical first release; earlier v1.1.0–v1.4.0
          # tags were private testing artifacts and are left untouched.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" build-output/*.apk build-output/SHA256SUMS-android.txt build-output/manifest-android.json --clobber 2>&1 | tee /tmp/release.log
          else
            gh release create "$RELEASE_TAG" build-output/*.apk build-output/SHA256SUMS-android.txt build-output/manifest-android.json \
              --title "$RELEASE_TITLE" \
              --notes-file /tmp/release_notes.md \
              2>&1 | tee /tmp/release.log || {
                echo "Create raced with a concurrent publish, falling back to clobber upload..."
                gh release upload "$RELEASE_TAG" build-output/*.apk build-output/SHA256SUMS-android.txt build-output/manifest-android.json --clobber 2>&1 | tee -a /tmp/release.log
              }
          fi
          echo "GitHub Release step completed!"

      - name: Report pipeline telemetry to feedback branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          APK_GEN="false"
          APK_SZ="none"
          if [ -f "build-output/Omega.apk" ]; then
            APK_GEN="true"
            APK_SZ=$(ls -lh build-output/Omega.apk | awk '{print $5}')
          fi
          git fetch origin ci-feedback:refs/remotes/origin/ci-feedback 2>/dev/null || true
          git checkout -B ci-feedback refs/remotes/origin/ci-feedback 2>/dev/null || git checkout -B ci-feedback
          mkdir -p logs
          echo "JOB_STATUS=${{ job.status }}" > logs/verify.txt
          echo "BUILD_WEB_OUTCOME=${{ steps.build_web.outcome }}" >> logs/verify.txt
          echo "TEST_OUTCOME=${{ steps.test.outcome }}" >> logs/verify.txt
          echo "CAP_SYNC_OUTCOME=${{ steps.cap_sync.outcome }}" >> logs/verify.txt
          echo "BUILD_APK_OUTCOME=${{ steps.build_apk.outcome }}" >> logs/verify.txt
          echo "PREPARE_APK_OUTCOME=${{ steps.prepare_apk.outcome }}" >> logs/verify.txt
          echo "UPLOAD_APK_OUTCOME=${{ steps.upload_apk.outcome }}" >> logs/verify.txt
          echo "RELEASE_OUTCOME=${{ steps.release.outcome }}" >> logs/verify.txt
          echo "APK_GENERATED=$APK_GEN" >> logs/verify.txt
          echo "APK_SIZE=$APK_SZ" >> logs/verify.txt
          echo "SHA=${{ github.sha }}" >> logs/verify.txt
          echo "REF=${{ github.ref }}" >> logs/verify.txt
          echo "DATE=$(date -u)" >> logs/verify.txt
          cp *.log logs/ 2>/dev/null || true
          cp /tmp/release.log logs/release.log 2>/dev/null || true
          cp android/*.log logs/ 2>/dev/null || true
          find android/app/build -name "*.txt" -exec cp {} logs/ \; 2>/dev/null || true
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            cp logs/verify.txt logs/tag_release_verify.txt
            git add -f logs/
            git commit -m "ci: release report for ${{ github.ref }} (${{ github.sha }}) [skip ci]" || true
            git push -f origin HEAD:refs/heads/ci-release 2>&1 || true
          else
            git add -f logs/
            git commit -m "ci: complete build report for ${{ github.ref }} (${{ github.sha }}) [skip ci]" || true
          fi
          git push -f origin HEAD:refs/heads/ci-feedback 2>&1 || echo "ci-feedback push skipped"
