name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de la release (ej: v1.0.0 o latest)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --dangerously-allow-all-builds 2>&1 | tee pnpm_install.log

      - name: Build Web Application
        run: pnpm run build 2>&1 | tee pnpm_build.log

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Configure Android SDK & Licenses
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 | tee sdkmanager_licenses.log || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-35" 2>&1 | tee sdkmanager_install.log || true

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew 2>&1 | tee chmod_gradlew.log

      - name: Sync Capacitor Android
        run: pnpm exec cap sync android 2>&1 | tee cap_sync.log

      - name: Build Android APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'omega2025' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'omega' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'omega2025' }}
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle_build.log || ./gradlew assembleRelease --stacktrace 2>&1 | tee -a gradle_build.log

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" ! -name "*unaligned*" | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Found built APK at: $APK_FILE"
            cp "$APK_FILE" build-output/Omega.apk
            ls -lh build-output/Omega.apk
          else
            echo "Error: No APK found in android/app/build/outputs/apk!"
            find android/app/build -type f || true
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omega-Android-APK
          path: build-output/Omega.apk
          if-no-files-found: error

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
            echo "title=Omega Android ${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "title=Omega Android ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "title=Omega Android (Latest Version)" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body: |
            ## 🌌 Omega v1.1.0 — Unified Wellness Hub
            
            Major release featuring a complete interface redesign inspired by **Android 17 / Material Design (Google I/O 2026)**, tactile glassmorphism, Wim Hof Method aesthetics, ultra-fluid 90Hz/120Hz GPU-accelerated performance, responsive desktop layout, and dual compilation for Android and PC.

            ### 📥 Direct APK Download
            Download the attached pre-compiled APK directly:
            👉 **[Omega.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.tag }}/Omega.apk)**
            
            ### 🚀 Installation Instructions
            1. Download `Omega.apk` on your Android device.
            2. Tap the downloaded file to install (enable "Allow from this source" if prompted).
            3. Open Omega and enjoy the ultra-smooth unified wellness experience!

            ### ✨ What's New in v1.1.0
            - 🎨 **Android 17 & Glassmorphism Design System**: Squircles, frosted glass with subtle border illumination, and organic glacier/volcanic basalt palette.
            - ⚡ **90Hz / 120Hz (ProMotion) High-Refresh Optimization**: Pure GPU layer composition (`transform`, `opacity`, `will-change`), zero layout thrashing, and drift-free delta timers.
            - 🖥️ **Adaptive Responsive Experience**: Ergonomic Bottom Navigation Bar on mobile (<768px) with 4-edge safe-areas; dynamic **Navigation Rail / Sidebar** and multi-column grid on desktop/PC (≥768px).
            - 💻 **Cross-Platform PC & Electron Support**: Pre-configured Electron desktop integration (`npm run electron:dev`, `npm run electron:build`).
            - 🌬️ **Bubble Breathing**: Rhythmic guided Wim Hof breathing with organic animated sphere, retention, and recovery phases.
            - ❄️ **HydroCycle**: Cold/hot contrast shower interval timer with ambient soundscapes (ocean, rain, white noise).
            - 🔒 **Native Services Universal Bridge**: Fault-tolerant Keep-Awake cascade (Electron IPC, Capacitor, Web WakeLock) and tactile haptics abstraction.
          files: build-output/Omega.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Failure Diagnostics to ci-logs Branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          mkdir -p ci-debug
          echo "FAILED_ACTION=$GITHUB_ACTION" > ci-debug/failed_step.txt
          echo "RUN_NUMBER=${{ github.run_number }}" >> ci-debug/failed_step.txt
          cp *.log ci-debug/ 2>/dev/null || true
          cp android/*.log ci-debug/ 2>/dev/null || true
          find android/app/build -name "*.txt" -exec cp {} ci-debug/ \; 2>/dev/null || true
          git status > ci-debug/status.txt || true
          git add -f ci-debug
          git commit -m "ci: failure logs from run ${{ github.run_number }}" || true
          git push -f origin ci-logs || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
