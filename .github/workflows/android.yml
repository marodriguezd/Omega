name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de la release (ej: v1.0.0 o latest)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --dangerously-allow-all-builds

      - name: Build Web Application
        run: pnpm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Omega.apk
          echo "APK built successfully:"
          ls -lh build-output/Omega.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omega-Android-APK
          path: build-output/Omega.apk
          if-no-files-found: error

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
            echo "title=Omega Android ${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "title=Omega Android ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "title=Omega Android (Última versión)" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body: |
            ## 📱 Omega - Hub de Bienestar para Android
            
            Archivo APK compilado listo para descargar e instalar en tu teléfono o tableta Android.

            ### 📥 Descarga del APK
            Descarga directamente el archivo adjunto:
            👉 **[Omega.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.tag }}/Omega.apk)**
            
            ### 🚀 Instrucciones de instalación
            1. Descarga `Omega.apk` en tu dispositivo Android.
            2. Pulsa en el archivo descargado para instalarlo (si Android te pide permiso, activa "Permitir desde esta fuente").
            3. ¡Abre Omega y disfruta de tu rutina combinada!

            ### ✨ Características
            - **Bubble Breathing**: Ejercicios guiados de respiración profunda y apnea consciente (método Wim Hof).
            - **HydroCycle**: Temporizador guiado de contraste calor-frío e inmersión en agua fría.
            - **Dashboard Unificado**: Métricas combinadas, racha activa y objetivos de bienestar diarios.
            - **Pantalla Activa (Keep Awake)**: La pantalla permanece encendida durante toda la sesión.
            - **Navegación Móvil Integrada**: Barra inferior fluida y soporte para el botón Atrás nativo.
          files: build-output/Omega.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
