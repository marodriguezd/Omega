name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de la release (ej: v1.0.0 o latest)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --dangerously-allow-all-builds

      - name: Build Web Application
        run: pnpm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Omega.apk
          echo "APK built successfully:"
          ls -lh build-output/Omega.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omega-Android-APK
          path: build-output/Omega.apk
          if-no-files-found: error

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
            echo "title=Omega Android ${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "title=Omega Android ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "title=Omega Android (Latest Version)" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body: |
            ## 📱 Omega - Wellness Hub for Android
            
            Pre-compiled Android APK ready to download and install directly on your Android phone or tablet.

            ### 📥 Direct APK Download
            Download the attached APK file directly:
            👉 **[Omega.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.release_info.outputs.tag }}/Omega.apk)**
            
            ### 🚀 Installation Instructions
            1. Download `Omega.apk` to your Android device.
            2. Tap the downloaded file to install it (if prompted by Android, enable "Allow from this source" for your browser).
            3. Open Omega and enjoy your unified wellness routine!

            ### ✨ Features
            - **Bubble Breathing**: Guided deep breathing and conscious breath-holding cycles (Wim Hof inspired).
            - **HydroCycle**: Guided contrast therapy (hot/cold intervals) and cold water exposure timer.
            - **Unified Wellness Dashboard**: Combined active streak, daily habits checklist, and aggregated metrics.
            - **Screen Keep Awake**: Keeps your screen awake during breathing exercises and shower sessions.
            - **Zoom & Interface Scaling**: Browser-like zoom control (80% to 220%, with 150% recommended preset) + pinch-to-zoom support.
            - **Fluid Mobile Navigation**: Fixed bottom navigation bar with Android hardware back button handling.
            - **Multilingual Support**: Fully translated into 7 languages (English, Spanish, French, German, Italian, Portuguese, and Simplified Chinese).
          files: build-output/Omega.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
