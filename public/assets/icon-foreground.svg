<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <radialGradient id="ambient-glow" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="omega-flow" x1="20%" y1="80%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="25%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="75%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <radialGradient id="core-glow" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#67e8f9" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.2"/>
    </radialGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="54" cy="52" r="38" fill="url(#ambient-glow)"/>

  <!-- Main Omega Ribbon -->
  <path d="M 23 80.5 L 38.5 80.5 C 46 80.5 43.8 64.5 39.2 56 C 34.2 46.8 37.1 29.1 54 29.1 C 70.9 29.1 73.8 46.8 68.8 56 C 64.2 64.5 62 80.5 69.5 80.5 L 85 80.5"
        fill="none" stroke="url(#omega-flow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Highlight Reflection on Apex -->
  <path d="M 43.5 33.3 C 46.5 30.3 50.1 29.1 54 29.1 C 57.9 29.1 61.5 30.3 64.5 33.3"
        fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

  <!-- Central Breath Core -->
  <circle cx="54" cy="52" r="7.2" fill="url(#core-glow)" filter="url(#glow)"/>
  <circle cx="52" cy="50" r="2" fill="#ffffff" opacity="0.9"/>
</svg>